[project]
name = "hermes-mobile"
version = "0.1.0"
description = "Hermes Agent Mobile - AI Agent for Android"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "flet>=0.24.0",
    # WebView automation (webview_flutter) for the agent browser. Only on
    # Python >= 3.10: the package pins python>=3.10 while the project still
    # supports 3.9 (legacy Flet 0.28 CI line, which cannot use it anyway).
    "flet-webview>=0.86.0; python_version >= '3.10'",
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "websockets>=15.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "sqlite-utils>=3.37.0",
    "aiofiles>=23.2.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "tenacity>=8.2.0",
    "tiktoken>=0.7.0",
    "markdown>=3.6.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "cryptography>=42.0.0",
    "keyring>=25.0.0",
    "platformdirs>=4.2.0",
    "apscheduler>=3.10.0",
    "croniter>=6.0.0",
    "plyer>=2.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["hermes_mobile*"]
exclude = ["assets*", "tests*"]

[tool.flet.android.manifest_application]
# Allow plain-http destinations (local Ollama, http:// sites) inside the
# WebView on Android; Android blocks cleartext by default.
usesCleartextTraffic = "true"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "black>=24.3.0",
]

[dependency-groups]
# PEP 735 dev group, installed by `uv run`/`uv sync` (used by the CI
# flet-build-action). Keeps `flet-cli` present in the build venv so that
# `flet --version --json` emits clean JSON: without it, the flet entry point
# bootstraps flet-cli on demand and prints an "Installing flet-cli ..." banner
# to stdout, which breaks the action's JSON parsing.
# Not bundled into the APK: `flet build` only packages `[project].dependencies`.
dev = [
    "flet-cli>=0.24.0",
]

[tool.flet]
product = "Hermes Mobile"
bundle_id = "com.hermes.mobile"
build_number = 1
permissions = [
    "INTERNET",
    "ACCESS_NETWORK_STATE",
    "FOREGROUND_SERVICE",
    "FOREGROUND_SERVICE_DATA_SYNC",
    "RECEIVE_BOOT_COMPLETED",
    "WAKE_LOCK",
    "VIBRATE",
    "POST_NOTIFICATIONS",
]

[tool.flet.splash]
color = "#0D2F86"
dark_color = "#0D2F86"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Enforce correctness and import hygiene repository-wide. Complexity and
# modernization rules are audited incrementally instead of breaking CI on
# the pre-existing legacy baseline.
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]