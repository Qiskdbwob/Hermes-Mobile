[project]
name = "hermes-mobile"
version = "0.1.0"
description = "Hermes Agent Mobile - AI Agent for Android"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "flet>=0.24.0",
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "sqlite-utils>=3.37.0",
    "aiofiles>=23.2.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "tenacity>=8.2.0",
    "tiktoken>=0.7.0",
    "markdown>=3.6.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "cryptography>=42.0.0",
    "keyring>=25.0.0",
    "platformdirs>=4.2.0",
    "apscheduler>=3.10.0",
    "plyer>=2.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["hermes_mobile*"]
exclude = ["assets*", "tests*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "black>=24.3.0",
]
android = [
    "buildozer>=1.5.0",
    "cython>=3.0.0",
]

[tool.flet]
app_name = "Hermes Mobile"
package = "com.hermes.mobile"
version = "0.1.0"
build_number = 1
icon = "assets/icon.png"
splash = {}
permissions = [
    "INTERNET",
    "ACCESS_NETWORK_STATE",
    "FOREGROUND_SERVICE",
    "FOREGROUND_SERVICE_DATA_SYNC",
    "RECEIVE_BOOT_COMPLETED",
    "WAKE_LOCK",
    "VIBRATE",
    "POST_NOTIFICATIONS",
]
android_min_sdk = 24
android_target_sdk = 34

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20", "W", "PL"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]